name: Publish test release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.0.1-test.1"
      source_ref:
        description: "Branch or commit to build"
        required: true
        default: "main"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-test-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    env:
      DEFAULT_TAG: v0.0.1-test.1
      DEFAULT_SOURCE_REF: main
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Select release inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
            echo "SOURCE_REF=${{ inputs.source_ref }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=$DEFAULT_TAG" >> "$GITHUB_ENV"
            echo "SOURCE_REF=$DEFAULT_SOURCE_REF" >> "$GITHUB_ENV"
          fi

      - name: Checkout test source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: >
          xcodebuild
          -project FreeCamIP.xcodeproj
          -scheme FreeCamIP
          -configuration Debug
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/device
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/device/Build/Products/Debug-iphoneos/FreeCamIP.app build/Payload/
          cd build
          zip -qry FreeCamIP-unsigned.ipa Payload

      - name: Publish prerelease
        shell: bash
        run: |
          NOTES=$(cat <<'EOF'
          FreeCamIP M0 test build.

          Includes:
          - AVFoundation camera capture
          - VideoToolbox H.264 encoding
          - TCP control handshake
          - UDP FreeCam video transport
          - manual Windows PC IP entry

          The IPA is unsigned and must be signed/sideloaded before installation on a physical iPhone.
          EOF
          )

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/FreeCamIP-unsigned.ipa --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" build/FreeCamIP-unsigned.ipa --target "$SOURCE_REF" --title "FreeCamIP $RELEASE_TAG" --notes "$NOTES" --prerelease --repo "$GITHUB_REPOSITORY"
          fi
