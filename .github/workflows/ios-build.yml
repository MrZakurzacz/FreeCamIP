name: iOS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: >
          xcodebuild
          -project FreeCamIP.xcodeproj
          -scheme FreeCamIP
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build unsigned iPhone app
        run: >
          xcodebuild
          -project FreeCamIP.xcodeproj
          -scheme FreeCamIP
          -configuration Debug
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/device
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/device/Build/Products/Debug-iphoneos/FreeCamIP.app build/Payload/
          cd build
          zip -qry FreeCamIP-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          path: build/FreeCamIP-unsigned.ipa
          archive: false
          retention-days: 14
